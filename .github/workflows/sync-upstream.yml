name: Auto Sync Upstream

on:
  schedule:
    # Chạy tự động mỗi ngày lúc 00:00 UTC (07:00 sáng giờ VN)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: custom-patches
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream and Fetch
        run: |
          git remote add upstream https://github.com/decolua/9router.git || true
          git fetch upstream

      - name: Sync master
        run: |
          git checkout master
          git merge upstream/master --ff-only || git merge upstream/master -m "chore: sync upstream master"
          git push origin master

      - name: Merge into custom-patches
        run: |
          git checkout custom-patches
          git merge master -m "chore: auto-sync updates from upstream"
          git push origin custom-patches
